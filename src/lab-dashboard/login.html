<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFE · Finanzas — acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /*
    Esta página se sirve SIN sesión válida, así que no puede depender de
    style.css (protegido por middleware.js). Se copian acá los mismos
    tokens de diseño (paleta papel/verde salvia/terracota, Fraunces +
    Work Sans) para mantener coherencia visual con el dashboard.
  */
  :root {
    --paper:        #faf5ea;
    --paper-raised: #fffdf7;
    --line:         #e6dcc4;
    --ink:          #332d22;
    --ink-soft:     #6e6552;
    --ink-faint:    #766c54;
    --green:        #7c9a6b;
    --green-deep:   #5f7d52;
    --terracotta:   #c97d55;
    --danger:       #c25f4a;
    --shadow:       0 3px 14px rgba(76, 62, 30, 0.08);
    --shadow-hover: 0 8px 22px rgba(76, 62, 30, 0.13);
    --radius:       18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-weight: 400;
    font-size: 14.5px;
    line-height: 1.5;
    padding: 20px;
  }

  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: var(--shadow);
  }

  .eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--ink-soft);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 30px;
    margin: 6px 0 4px;
    color: var(--ink);
  }

  .subtitle {
    color: var(--ink-soft);
    margin: 0 0 22px;
    font-size: 13.5px;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.2px;
    margin-bottom: 6px;
  }

  input[type="password"] {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-size: 14.5px;
    margin-bottom: 16px;
  }

  input[type="password"]:focus {
    outline: 2px solid var(--green);
    outline-offset: 1px;
  }

  button {
    width: 100%;
    padding: 12px 14px;
    border: none;
    border-radius: 10px;
    background: var(--green-deep);
    color: var(--paper-raised);
    font-family: 'Work Sans', sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    transition: box-shadow 0.18s ease, transform 0.18s ease;
  }

  button:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
  }

  button:focus-visible {
    outline: 2px solid var(--terracotta);
    outline-offset: 2px;
  }

  .error-msg {
    display: none;
    background: rgba(194, 95, 74, 0.1);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .error-msg.visible {
    display: block;
  }
</style>
</head>
<body>
  <main class="login-card">
    <span class="eyebrow">LIFE · Finanzas</span>
    <h1>Acceso privado</h1>
    <p class="subtitle">Este dashboard contiene datos financieros reales. Ingresá la contraseña para continuar.</p>

    <p class="error-msg" id="error-msg" role="alert">Contraseña incorrecta. Probá de nuevo.</p>

    <form method="POST" action="/login">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        autofocus
        required
        aria-describedby="error-msg"
      >
      <button type="submit">Entrar</button>
    </form>
  </main>

  <script>
    if (new URLSearchParams(window.location.search).get('error') === '1') {
      document.getElementById('error-msg').classList.add('visible');
    }
  </script>
</body>
</html>
